<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Blurrier - Fourier Video Preview</title>
  <style>
    body, html, input {
      font-family: sans-serif;
      font-size: 11pt;
    }

    canvas {
      image-rendering: pixelated; 
      image-rendering: crisp-edges;

      max-width: 256px;
      max-height: 256px;

      background: #000;
      border: 1px solid #444;
    }

    #pageTitle {
      margin-left: 20px;
    }

    #controls {
      display: block;
      position: relative;
    }

    #controls div {
      display: inline-block;
      margin: 0px 20px 0 20px;
      vertical-align: top;
    }

    #controls p {
      margin: 0;
    }

    #controls div div {
      margin: 0 !important;
      width: 35px;
    }

    #rulesContainer {
      display: inline-block; 
      text-align: left;
    }

    .centerVertically {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
    }

    .item1 { grid-area: header; }
    .item2 { grid-area: plot; }
    .item3 { grid-area: footer; }
    .item4 { grid-area: screenshots; }
    .item5 { grid-area: screenshotsTwo; }
    .item6 { grid-area: screenshotsThree; }
    .item7 { grid-area: screenshotsFour; }

    .grid-container {
      display: grid;
      grid-template-areas:
        'header header header header header header header'
        'plot plot plot plot plot plot plot'
        'footer footer footer footer footer footer footer'
        'screenshots screenshots screenshots screenshots screenshots screenshots screenshots'
        'screenshotsTwo screenshotsTwo screenshotsTwo screenshotsTwo screenshotsTwo screenshotsTwo screenshotsTwo'
        'screenshotsThree screenshotsThree screenshotsThree screenshotsThree screenshotsThree screenshotsThree screenshotsThree'
        'screenshotsFour screenshotsFour screenshotsFour screenshotsFour screenshotsFour screenshotsFour screenshotsFour';
      grid-gap: 10px;
      padding: 10px;
      max-height: 1424px;
    }

    .grid-container > div {
      text-align: center;
      padding: 0 0;
      font-size: 11pt;
    }

    .screenshots {
      border: 1px solid #333333;
    }

    .item6 > div {
      margin: 0px 7px;
    }

    .item7 > div {
      margin-bottom: 20px;
    }

    .inline-images {
      display: inline-block;
    }

    .github-corner {
      fill:#4983db;
    }

    .github-corner:hover .octo-arm {
        animation: octocat-wave 560ms ease-in-out;
      }
      @keyframes octocat-wave
      {
        0%,100%
        {
          transform: rotate(0);
        }
        20%,60%
        {
          transform: rotate(-25deg);
        }
        40%,80%
        {
          transform: rotate(10deg);
        }
      }
      @media (max-width:500px)
      {
        .github-corner:hover .octo-arm
        {
          animation: none;
        }
        .github-corner .octo-arm
        {
          animation: octocat-wave 560ms ease-in-out;
        }
      }

  </style>
</head>
<body>

  <a target="_blank" href="https://github.com/Apidcloud/blurrier" class="github-corner" aria-label="View source on Github">
    <svg width="80" height="80" viewBox="0 0 250 250" style="color:#ffffff; position: absolute; top: 0; border: 0; right: 0;" aria-hidden="true">
      <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path>
      <path d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2" fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"></path>
      <path d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z" fill="currentColor" class="octo-body"></path>
    </svg>
  </a>

  <div class="grid-container">
    <div class="item1">
      <h1 id="pageTitle">Blurrier - Fourier Video Preview</h1>

      <div id="controls">
        <div>
          <p>Pick Video</p>
          <input type="file" id="videoPicker" accept="video/mp4" />
          <label for="seekBar" id="statusLabel">Waiting for video...</label>
          <input type="range" id="seekBar" min="0" value="0" step="0.01" disabled style="with: 300px;" />
        </div>
        <div>
          <canvas id="previewCanvas" />
        </div>
        <div>
          <canvas id="frequencyCanvas" />
        </div>
      </div>
    </div>

  <script type="module">
    import * as MP4Box from 'https://esm.sh/mp4box@2.3.0';

    const PREVIEW_SIZE = 128;

    const picker = document.getElementById("videoPicker");
    const slider = document.getElementById("seekBar");
    const label = document.getElementById('statusLabel');
    const canvas = document.getElementById("previewCanvas");
    const ctx = canvas.getContext("2d");

    const rawCanvas = new OffscreenCanvas(1, 1); 
    const rawCtx = rawCanvas.getContext('2d', { willReadFrequently: true });

    const tinyCanvas = new OffscreenCanvas(PREVIEW_SIZE, PREVIEW_SIZE);
    const tinyCtx = tinyCanvas.getContext('2d', { willReadFrequently: true });

    const freqCanvas = document.getElementById('frequencyCanvas');
    const freqCtx = freqCanvas.getContext('2d');

    let extractedFrames = [];

    picker.addEventListener('change', onChangeFile);
    slider.addEventListener('input', onSeek);

    function onChangeFile(e) {
      const file = e.target.files[0];
      if (!file) {
        return;
      }

      extractedFrames = [];
      slider.disabled = true;

      processVideoFile(file);
    }

    function onSeek(e) {
      const frameIndex = parseInt(e.target.value, 10);
      drawFrameToCanvas(frameIndex);
    }

    // simulate WebRTC/live streaming where we would get an encoded video chunk
    function processVideoFile(file) {
      const mp4BoxFile = MP4Box.createFile();

      const decoder = new VideoDecoder({
        output: async (frame) => {
          const width = frame.displayWidth;
          const height = frame.displayHeight;

          // copy y-plane (grayscale)
          const bufferSize = frame.allocationSize({ planeIndex: 0 });
          const buffer = new ArrayBuffer(bufferSize);
          const layout = await frame.copyTo(buffer, { planeIndex: 0 });

          const pixels = new Uint8Array(buffer);

          const rawFrameData = {
            timestamp: frame.timestamp,
            width,
            height,
            stride: layout[0].stride,
            pixels,
          };

          console.log(`Blurring frame at ${Math.round(frame.timestamp / 1000)}ms...`);
          const blurryPreview = createBlurryPreview(rawFrameData, 0.15);

          extractedFrames.push({
            timestamp: blurryPreview.timestamp,
            width: blurryPreview.width,  
            height: blurryPreview.height, 
            stride: blurryPreview.width,   
            pixels: blurryPreview.blurryPixels,
          });

          // decoders dont guarantee the order
          extractedFrames.sort((a, b) => a.timestamp - b.timestamp);

          label.textContent = `Extracted ${extractedFrames.length} keyframes`;
          slider.max = extractedFrames.length - 1;
          slider.disabled = false;

          if (extractedFrames.length === 1) {
            drawFrameToCanvas(0);
          }

          frame.close();
        },
        error: (e) => {
          console.error("Decoder error", e);
        }
      });

      // demuxer
      mp4BoxFile.onReady = (info) => {
        const videoTrack = info.videoTracks[0];
       
        let description = null;
        const track = mp4BoxFile.getTrackById(videoTrack.id);
        
        for (const entry of track.mdia.minf.stbl.stsd.entries) {
          // look for the codec configuration box (H.264, HEVC, VP9, or AV1)
          const box = entry.avcC || entry.hvcC || entry.vpcC || entry.av1C;
          if (box) {
            const stream = new MP4Box.DataStream(undefined, 0, MP4Box.DataStream.BIG_ENDIAN);
            box.write(stream);
            // WebCodecs wants the raw data, so we slice off the 8-byte MP4 box header
            description = new Uint8Array(stream.buffer, 8); 
            break;
          }
        }

        decoder.configure({
          codec: videoTrack.codec,
          codedWidth: videoTrack.track_width,
          codedHeight: videoTrack.track_height,
          description,
        });

        mp4BoxFile.setExtractionOptions(videoTrack.id);
        mp4BoxFile.start();
      };

      mp4BoxFile.onSamples = (id, user, samples) => {
        for (const sample of samples) {
          // only decode keyframes to keep lightweight
          if (sample.is_sync) {
            const chunk = new EncodedVideoChunk({
              type: 'key',
              timestamp: (sample.cts * 1000000) / sample.timescale,
              duration: (sample.duration * 1000000) / sample.timescale,
              data: sample.data
            });
            decoder.decode(chunk);
          }
        }
      };

      const reader = new FileReader();
      reader.onload = (e) => {
        const arrayBuffer = e.target.result;
        arrayBuffer.fileStart = 0;
        mp4BoxFile.appendBuffer(arrayBuffer);
        mp4BoxFile.flush();
      };
      reader.readAsArrayBuffer(file);
    }

    function drawFrameToCanvas(index) {
      if (!extractedFrames[index]) {
        return;
      }

      const { width, height, stride, pixels } = extractedFrames[index];

      canvas.width = width;
      canvas.height = height;
      const imageData = ctx.createImageData(width, height);

      // map 1d grayscale array to 1d rgba canvas array
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const luma = pixels[(y * stride) + x];
          const idx = (y * width + x) * 4;
          imageData.data[idx] = luma;     
          imageData.data[idx + 1] = luma;
          imageData.data[idx + 2] = luma;
          imageData.data[idx + 3] = 255;
        }
      }
      ctx.putImageData(imageData, 0, 0);
    }

    function createBlurryPreview(frameData, keepFraction = 0.15) {
      const { width, height, stride, pixels } = frameData;

      // compute preview dimensions that fit within PREVIEW_SIZE while preserving aspect ratio
      // dimensions must be powers of 2 for the FFT
      function nextPow2(v) { return Math.max(1, 1 << Math.ceil(Math.log2(v))); }
      const scale = Math.min(PREVIEW_SIZE / width, PREVIEW_SIZE / height);
      const pw = nextPow2(Math.round(width * scale));
      const ph = nextPow2(Math.round(height * scale));

      rawCanvas.width = width;
      rawCanvas.height = height;
      const rawImgData = rawCtx.createImageData(width, height);
  
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const luma = pixels[(y * stride) + x];
          const idx = (y * width + x) * 4;
          rawImgData.data.set([luma, luma, luma, 255], idx);
        }
      }
      rawCtx.putImageData(rawImgData, 0, 0);

      tinyCanvas.width = pw;
      tinyCanvas.height = ph;
      tinyCtx.drawImage(rawCanvas, 0, 0, width, height, 0, 0, pw, ph);
  
      const tinyPixels = tinyCtx.getImageData(0, 0, pw, ph).data;

      const grid = [];
      for (let y = 0; y < ph; y++) {
        const row = [];
        for (let x = 0; x < pw; x++) {
          const luma = tinyPixels[(y * pw + x) * 4];
          row.push(new Complex(luma, 0));
        }
        grid.push(row);
      }

      // const frequencies = naiveDFT2D(grid);
      const frequencies = fft2D(grid);

      drawFrequencyMap(frequencies);

      // lowpass filter
      const keepX = Math.floor(pw * keepFraction);
      const keepY = Math.floor(ph * keepFraction);
      for (let y = 0; y < ph; y++) {
        for (let x = 0; x < pw; x++) {
          if ((x > keepX && x < pw - keepX) || (y > keepY && y < ph - keepY)) {
            frequencies[y][x] = new Complex(0, 0);
          }
        }
      }

      // const blurryGrid = naiveIDFT2D(frequencies);
      const blurryGrid = fft2D(frequencies, true);

      const finalPixels = new Uint8ClampedArray(pw * ph);
      for (let y = 0; y < ph; y++) {
        for (let x = 0; x < pw; x++) {
          finalPixels[y * pw + x] = Math.max(0, Math.min(255, blurryGrid[y][x].re));
        }
      }

      return {
        timestamp: frameData.timestamp,
        width: pw, 
        height: ph,
        blurryPixels: finalPixels
      };
    }

    class Complex {
      constructor(re, im = 0) {
        this.re = re;
        this.im = im;
      }

      add(other) {
        return new Complex(this.re + other.re, this.im + other.im);
      }

      sub(other) {
        return new Complex(this.re - other.re, this.im - other.im);
      }

      // (a + bi) * (c + di) = (ac - bd) + (ad + bc)i
      mul(other) {
        return new Complex(
          this.re * other.re - this.im * other.im,
          this.re * other.im + this.im * other.re,
        );
      }
    }

    // slow version O(N^2)
    // let 
    // N: total number of samples
    // k: current frequency bin index (0..N-1)
    // n: current time/spatial sample index (0..N-1)
    // using Euler's formula e^(-i*theta) = cos(theta) - i*sin(theta)
    // this becomes:
    // X[k] = SUM(n=0 to N-1) { x[n] * e^(-i * 2*PI * k * n / N) }
    // where theta = (2 * PI * k * n) / N
    function naiveDFT(samples) {
      const N = samples.length;
      const output = [];

      for (let k = 0; k < N; k++) {
        let sum = new Complex(0, 0);

        for (let n = 0; n < N; n++) {
          const theta = (2 * Math.PI * k * n) / N;

          // create exponential using euler's formula
          const w = new Complex(Math.cos(theta), -Math.sin(theta));

          const term = samples[n].mul(w);
          sum = sum.add(term);
        }
        output.push(sum);
      }

      return output;
    }

    // const signal = [
    //   new Complex(1), new Complex(1), 
    //   new Complex(1), new Complex(1)
    // ];
    //
    // console.log(naiveDFT(signal));

    // very similar to the original thing; we only flip the euler sign and divide by N
    // to scale the values back down to their original amplitude
    // let
    // N: total number of samples
    // X[k] : The k-th frequency bin (Input)
    // x[n] : The n-th sample of the reconstructed signal (Output)
    // this becomes:
    // x[n] = (1/N) * SUM(k=0 to N-1) { X[k] * e^(i * 2*PI * k * n / N) }
    function naiveIDFT(samples) {
      const N = samples.length;
      const output = [];

      for (let n = 0; n < N; n++) {
        let sum = new Complex(0, 0);
        for (let k = 0; k < N; k++) {
          const theta = (2 * Math.PI * k * n) / N;

          const w = new Complex(Math.cos(theta), Math.sin(theta));

          const term = samples[k].mul(w);
          sum = sum.add(term);
        }

        // scale down by N
        sum.re /= N;
        sum.im /= N;

        output.push(sum);
      }

      return output;
    }

    // FFT (O(N log N))
    // because they are periodic, we can just calculate the 1st half
    // let
    // N: total number of samples in the current recursive iteration 
    // evens: even-indexed samples
    // odds: odd-indexed samples
    // k: current frequency bin index (0..N/2 - 1)
    // theta: (2 * PI * k) / N, representing the phase rotation
    // twiddle: e^(-i * theta) * odds[k], representing the shifted odd component
    // with the butterly/symmetry relationship:
    // results[k] = evens[k] + twiddle
    // results[k + N/2] = evens[k] - twiddle
    function fft(samples) {
      const N = samples.length;
      if (N <= 1) {
        return samples;
      }

      const evenSamples = [];
      const oddSamples = [];
      for (let n = 0; n < N; n++) {
        if ((n & 1) === 0) {
          evenSamples.push(samples[n]);
        } else {
          oddSamples.push(samples[n]);
        }
      }

      const evens = fft(evenSamples);
      const odds = fft(oddSamples);
      
      const results = new Array(N);
      for (let k = 0; k < N/2; k++) {
        const theta = (2 * Math.PI * k) / N;
        // rotate the odd to align with the even results
        const twiddle = new Complex(Math.cos(-theta), Math.sin(-theta)).mul(odds[k]);
        
        results[k] = evens[k].add(twiddle);
        results[k + N/2] = evens[k].sub(twiddle);
      }

      return results;
    }

    // const signal = [
    //   new Complex(1, 0), 
    //   new Complex(1, 0), 
    //   new Complex(1, 0), 
    //   new Complex(1, 0)
    // ];
    //
    // console.log("Testing FFT with [1, 1, 1, 1]:");
    // const result = fft(signal);
    //
    // console.log("Expecting bin 0 with re: 4.00 im: 0.00, and the 3 other bins to have 0.00 everywhere");
    // result.forEach((c, k) => {
    //   console.log(`Bin ${k}: { re: ${c.re.toFixed(2)}, im: ${c.im.toFixed(2)} }`);
    // });

    function fft2D(grid, inverse = false) {
      const rows = grid.length;
      const cols = grid[0].length;

      // if inverse, conjugate first, then fft, then conjugate and scale
      if (inverse) {
        grid = grid.map(row => row.map(c => new Complex(c.re, -c.im)));
      }

      let transformed = grid.map(row => fft(row));

      // transpose
      let transposed = transformed[0].map((_, colIdx) => transformed.map(row => row[colIdx]));

      // fft on all columns (now rows)
      let final = transposed.map(row => fft(row));

      // transpose back
      final = final[0].map((_, colIdx) => final.map(row => row[colIdx]));

      if (inverse) {
        return final.map(row => row.map(c => new Complex(c.re / (rows * cols), -c.im / (rows * cols))));
      }

      return final;
    }

    function drawFrequencyMap(frequencies) {
      const height = frequencies.length;
      const width = frequencies[0].length;

      freqCanvas.width = width;
      freqCanvas.height = height;
      const imageData = freqCtx.createImageData(width, height);

      const halfW = width >> 1;
      const halfH = height >> 1;

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          // use fftshift to swap quadrants so DC is centered
          const sy = (y + halfH) % height;
          const sx = (x + halfW) % width;
          const c = frequencies[sy][sx];
          const mag = Math.sqrt(c.re * c.re + c.im * c.im);

          // use log scale so we can see the dim stars
          // formula: 255 * log(1 + mag) / log(1 + max_possible_mag)
          const val = 20 * Math.log1p(mag);

          const idx = (y * width + x) * 4;
          imageData.data[idx] = val;
          imageData.data[idx + 1] = val;
          imageData.data[idx + 2] = val;
          imageData.data[idx + 3] = 255;
        }
      }
      freqCtx.putImageData(imageData, 0, 0);
    }

    // quick test for forward -> inverse naive dft
    // const originalSignal = [
    //   new Complex(1), new Complex(1), 
    //   new Complex(1), new Complex(1)
    // ];
    //
    // // forward Transform (Spatial Domain -> Frequency Domain)
    // const frequencies = naiveDFT(originalSignal);
    //
    // // inverse Transform (Frequency Domain -> Spatial Domain)
    // const reconstructedSignal = naiveIDFT(frequencies);
    //
    // console.log("Reconstructed Signal (Raw Complex Objects):");
    // console.log(reconstructedSignal);
    //
    // const finalPixels = reconstructedSignal.map(c => Math.round(c.re));
    // console.log("Final Reconstructed Pixels:", finalPixels);

    function naiveDFT2D(grid) {
      const height = grid.length;
      const width = grid[0].length;

      const rowResult = [];
      for (let y = 0; y < height; y++) {
        rowResult.push(naiveDFT(grid[y]));
      }

      const finalResult = new Array(height).fill(null).map(() => new Array(width));

      for (let x = 0; x < width; x++) {
        const column = [];
        for (let y = 0; y < height; y++) {
          column.push(rowResult[y][x]);
        }

        const colDFT = naiveDFT(column);

        for (let y = 0; y < height; y++) {
          finalResult[y][x] = colDFT[y];
        }
      }

      return finalResult;
    }

    function naiveIDFT2D(grid) {
      const height = grid.length;
      const width = grid[0].length;

      const rowResult = [];
      for (let y = 0; y < height; y++) {
        rowResult.push(naiveIDFT(grid[y]));
      }

      const finalResult = new Array(height).fill(null).map(() => new Array(width));

      for (let x = 0; x < width; x++) {
        const column = [];
        for (let y = 0; y < height; y++) {
          column.push(rowResult[y][x]);
        }

        const colIDFT = naiveIDFT(column);

        for (let y = 0; y < height; y++) {
          finalResult[y][x] = colIDFT[y];
        }
      }

      return finalResult;
    }
  </script>
